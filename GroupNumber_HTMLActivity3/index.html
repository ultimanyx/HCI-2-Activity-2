<body>
    <header>
            <h1>MOIST Student Registration System</h1>
            <p class="subhead">
                A simple online registration page where students can enter their information and view sample student records.
            </p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#registration">Registration</a>
        <a href="#students">Student List</a>
        <a href="#enrollment_sum">Enrollment Summary</a>
        <a href="#contact">Contact</a>
    </nav>
        
    <form action="">
        <label for="fullname">Full Name</label>
        <input type="text" name="fullname" id="fullname" placeholder="John Doe" required> <br><br>

        <label for="email">Email Address</label>
        <input type="email"  name="email" id="email"placeholder="JohnDoe@gmail.com" required> <br><br>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="•••••••" required><br><br>

        <label for="age">Age</label>
        <input type="number" name="age" id="age" placeholder="19" required><br><br>

        <label for="birthdate">BirthDate</label>
        <input type="date" name="birthdate" id="birtdate" required>

        <label for="gender">Gender</label>
        <input type="radio" name="gender" id="gender" required>
        

    </form>

</body>
